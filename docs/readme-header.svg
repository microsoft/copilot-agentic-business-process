<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" fill="none">
  <title>From AI agents to accountable business processes</title>
  <desc>Order intake moves from documents through AI extraction, human review, AI validation and human approval to an SAP-ready artifact. A reusable process core provides state, tasks, audit and monitoring to both order intake and future business processes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1800" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F9FF"/>
      <stop offset=".55" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#E7F6F6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#A7B9FF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#A7B9FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="64" y1="570" x2="1736" y2="706" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172D59"/>
      <stop offset=".55" stop-color="#283D77"/>
      <stop offset="1" stop-color="#155D70"/>
    </linearGradient>
    <linearGradient id="agent" x1="-50" y1="-50" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8264F3"/>
      <stop offset="1" stop-color="#464FCE"/>
    </linearGradient>
    <linearGradient id="human" x1="-50" y1="-50" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#159B9A"/>
      <stop offset="1" stop-color="#08757C"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#293B71" flood-opacity=".09"/>
    </filter>
    <filter id="iconShadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#354276" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1 7 5 2 9" stroke="#8E9EBB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="sparkle" stroke="white" stroke-width="3" stroke-linejoin="round">
      <path d="m0-28 8 20 20 8-20 8-8 20-8-20-20-8 20-8Z" fill="white" fill-opacity=".16"/>
      <path d="M30-34v12m-6-6h12" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g id="person" stroke="white" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cy="-14" r="13" fill="white" fill-opacity=".16"/>
      <path d="M-26 29v-7c0-14 12-23 26-23s26 9 26 23v7" fill="white" fill-opacity=".16"/>
    </g>
    <g id="check" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="m-7 0 5 5 10-11"/>
    </g>
  </defs>

  <rect width="1800" height="760" rx="28" fill="url(#background)"/>
  <ellipse cx="1130" cy="140" rx="730" ry="410" fill="url(#glow)"/>
  <g stroke="#C8D5EE" stroke-opacity=".4">
    <path d="M1434 0 1800 366M1518 0l282 282M0 568l192 192M0 634l126 126"/>
    <circle cx="1741" cy="71" r="122"/>
    <circle cx="1741" cy="71" r="172"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="99" fill="#182B50" font-size="43" font-weight="650" letter-spacing="-.8">From AI agents to accountable business processes</text>
    <rect x="1472" y="54" width="264" height="56" rx="28" fill="white" fill-opacity=".85" stroke="#D1DCEE"/>
    <circle cx="1502" cy="82" r="5" fill="#6861D8"/>
    <text x="1613" y="90" text-anchor="middle" fill="#314568" font-size="23" font-weight="600">Copilot Studio</text>

    <!-- Domain-specific work sits above the shared runtime. -->
    <rect x="64" y="168" width="1260" height="330" rx="28" fill="white" filter="url(#shadow)"/>
    <rect x="64.5" y="168.5" width="1259" height="329" rx="27.5" stroke="#DCE4F2"/>
    <rect x="92" y="191" width="162" height="40" rx="20" fill="#EDF2FC"/>
    <text x="173" y="218" text-anchor="middle" fill="#304871" font-size="23" font-weight="600">Order intake</text>

    <g font-size="18" font-weight="600" fill="#5A6B88">
      <use href="#sparkle" transform="translate(998 212) scale(.28)" stroke="#6258C8"/>
      <circle cx="998" cy="212" r="5" fill="#6C5BDC"/>
      <text x="1014" y="218">AI</text>
      <circle cx="1101" cy="212" r="6" fill="#148F91"/>
      <text x="1117" y="218">Human decision</text>
    </g>

    <g stroke="#A9B7CC" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M230 333h89"/>
      <path d="M439 333h86"/>
      <path d="M645 333h86"/>
      <path d="M851 333h86"/>
      <path d="M1057 333h88"/>
    </g>

    <!-- Incoming documents. -->
    <g transform="translate(176 333)" filter="url(#iconShadow)">
      <rect x="-54" y="-54" width="108" height="108" rx="25" fill="#EFF5FF" stroke="#D2E0F6"/>
      <rect x="-16" y="-40" width="45" height="56" rx="5" transform="rotate(12)" fill="white" stroke="#7D9AC6" stroke-width="2"/>
      <rect x="-30" y="-34" width="45" height="56" rx="5" transform="rotate(-7)" fill="white" stroke="#5A83BB" stroke-width="2"/>
      <path d="M-20-20H3m-23 9H-4" stroke="#90A9CC" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="-36" y="-3" width="72" height="44" rx="7" fill="#E2EDFF" stroke="#5281BD" stroke-width="2.5"/>
      <path d="m-33 1 29 20a7 7 0 0 0 8 0L33 1" stroke="#5281BD" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <g transform="translate(382 333)">
      <rect x="-55" y="-55" width="110" height="110" rx="29" fill="url(#agent)" filter="url(#iconShadow)"/>
      <use href="#sparkle"/>
      <rect x="24" y="24" width="39" height="39" rx="11" fill="#F3F0FF" stroke="#D4CCF5" stroke-width="2"/>
      <path d="M35 35h17m-17 7h17m-17 7h10" stroke="#7061C6" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(588 333)">
      <circle r="55" fill="url(#human)" filter="url(#iconShadow)"/>
      <use href="#person"/>
      <circle cx="40" cy="40" r="21" fill="#E7FAF5" stroke="#B8DDD5" stroke-width="2"/>
      <path d="m32 39 6 6 12-13" stroke="#0C8480" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(794 333)">
      <rect x="-55" y="-55" width="110" height="110" rx="29" fill="url(#agent)" filter="url(#iconShadow)"/>
      <use href="#sparkle"/>
      <rect x="24" y="24" width="39" height="39" rx="11" fill="#F3F0FF" stroke="#D4CCF5" stroke-width="2"/>
      <path d="m34 42 6 6 12-13" stroke="#7061C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(1000 333)">
      <circle r="55" fill="url(#human)" filter="url(#iconShadow)"/>
      <use href="#person"/>
      <circle cx="40" cy="40" r="21" fill="#E7FAF5" stroke="#B8DDD5" stroke-width="2"/>
      <path d="m32 39 6 6 12-13" stroke="#0C8480" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- A generated artifact, not an implied live ERP write. -->
    <g transform="translate(1206 333)" filter="url(#iconShadow)">
      <rect x="-54" y="-54" width="108" height="108" rx="25" fill="#EFF5FF" stroke="#D2E0F6"/>
      <path d="M-25-38h34l21 21v52a5 5 0 0 1-5 5h-50a5 5 0 0 1-5-5v-68a5 5 0 0 1 5-5Z" fill="white" stroke="#5682BD" stroke-width="2.5"/>
      <path d="M9-38v17a4 4 0 0 0 4 4h17" stroke="#5682BD" stroke-width="2.5"/>
      <path d="m-10-3-8 10 8 10m20-20 8 10-8 10" stroke="#5682BD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="32" cy="34" r="18" fill="#138F8C"/>
      <use href="#check" transform="translate(32 34) scale(.8)"/>
    </g>

    <g fill="#293E60" font-size="25" font-weight="600" text-anchor="middle">
      <text x="176" y="445">Intake</text>
      <text x="382" y="445">Extract</text>
      <text x="588" y="445">Review</text>
      <text x="794" y="445">Validate</text>
      <text x="1000" y="445">Approve</text>
      <text x="1206" y="445">SAP-ready</text>
    </g>

    <rect x="1360" y="168" width="376" height="330" rx="28" fill="white" fill-opacity=".55" stroke="#A7B6D4" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="1548" y="222" text-anchor="middle" fill="#3D5276" font-size="26" font-weight="600">Your next process</text>
    <g transform="translate(1548 333)" stroke-linejoin="round">
      <path d="M-65 12v-40H0m0 40v-40h65v40" stroke="#A0AEC9" stroke-width="3"/>
      <rect x="-26" y="-54" width="52" height="52" rx="14" fill="#E6E3FA" stroke="#8E87C8" stroke-width="2"/>
      <rect x="-91" y="10" width="52" height="52" rx="14" fill="#DCEEF2" stroke="#76A4B0" stroke-width="2"/>
      <rect x="-26" y="10" width="52" height="52" rx="14" fill="#E2EAFA" stroke="#8CA2C9" stroke-width="2"/>
      <rect x="39" y="10" width="52" height="52" rx="14" fill="#F4F7FC" stroke="#A6B7D1" stroke-width="2" stroke-dasharray="5 4"/>
      <path d="M0-38v20m-10-10h20M65 26v20m-10-10h20" stroke="#7C87B1" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-65" cy="36" r="7" fill="#72A5B1"/>
      <path d="m-8 36 6 6 11-12" stroke="#849CC7" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g stroke="#8096BE" stroke-width="2.5">
      <path d="M694 499v71"/>
      <path d="M1548 499v71" stroke-dasharray="6 6"/>
    </g>
    <circle cx="694" cy="534" r="6" fill="#A9BEE3" stroke="#EEF2FC" stroke-width="4"/>
    <circle cx="1548" cy="534" r="6" fill="#A9BEE3" stroke="#EEF2FC" stroke-width="4"/>

    <rect x="64" y="570" width="1672" height="138" rx="26" fill="url(#core)" filter="url(#shadow)"/>
    <g transform="translate(122 639)" stroke="#99C5FC" stroke-width="2.5" stroke-linejoin="round">
      <path d="m0-25 28 14L0 3-28-14Z" fill="#82B3FF" fill-opacity=".15"/>
      <path d="m-28 0 28 14L28 0m-56 14L0 28l28-14"/>
    </g>
    <text x="173" y="649" fill="white" font-size="31" font-weight="600">Reusable process core</text>
    <path d="M548 604v70" stroke="#7692C0" stroke-opacity=".4"/>

    <g stroke="#AECEFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(618 639)">
        <path d="M-20 0a20 20 0 1 1 7 15"/>
        <path d="M-20-12V0h12M0-11V0l9 6"/>
      </g>
      <g transform="translate(865 639)">
        <rect x="-19" y="-24" width="38" height="48" rx="6"/>
        <path d="m-11-9 3 3 5-6M3-9h8m-22 17 3 3 5-6M3 8h8"/>
      </g>
      <g transform="translate(1110 639)">
        <path d="m0-25 21 8v15c0 13-9 22-21 28-12-6-21-15-21-28v-15Z"/>
        <path d="m-9 0 6 6 13-14"/>
      </g>
      <g transform="translate(1368 639)">
        <rect x="-26" y="-20" width="52" height="35" rx="5"/>
        <path d="M-12 25h24M0 15v10m-18-11 10-10 10 5 15-16"/>
      </g>
    </g>
    <g fill="#F0F6FF" font-size="27" font-weight="500">
      <text x="657" y="648">State</text>
      <text x="904" y="648">Tasks</text>
      <text x="1149" y="648">Audit</text>
      <text x="1415" y="648">Monitoring</text>
    </g>
  </g>
</svg>
